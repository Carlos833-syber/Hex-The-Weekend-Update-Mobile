name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [master, main, 'coderabbit/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.2.5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android toolchain
        run: sdkmanager "platforms;android-33" "build-tools;30.0.3" "ndk;21.4.7075529"
      - name: Use Java 11 for legacy Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - name: Install pinned Haxe libraries and Hex renderer
        run: bash scripts/setup-android.sh
      - name: Test multitouch input
        run: bash scripts/test-mobile-input.sh
      - name: Configure Lime
        run: |
          haxelib run lime config ANDROID_SDK "$ANDROID_HOME"
          haxelib run lime config ANDROID_NDK_ROOT "$ANDROID_HOME/ndk/21.4.7075529"
          haxelib run lime config JAVA_HOME "$JAVA_HOME"
          haxelib run lime config ANDROID_SETUP true
      - name: Build installable APK (ARMv7 + ARM64)
        run: haxelib run lime build android -debug -D HXCPP_CHECK_POINTER
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hex-Weekend-Android-debug
          path: export/debug/android/bin/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
